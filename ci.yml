name: CI Basico
on: [push]
jobs:
  verificar-archivos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Todos los archivos requeridos estan presentes."